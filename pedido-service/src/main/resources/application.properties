server.port=8084
spring.application.name=pedido-service
spring.datasource.url=${CORPALIV_DB_URL:jdbc:mysql://localhost:3306/corpaliv_pedidos?createDatabaseIfNotExist=true}
spring.datasource.username=${CORPALIV_DB_USER:root}
spring.datasource.password=${CORPALIV_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql
corpaliv.jwt-secret=${CORPALIV_JWT_SECRET}
corpaliv.jwt-issuer=corpaliv-local
corpaliv.producto-url=${CORPALIV_PRODUCTO_URL:http://localhost:8081}
springdoc.swagger-ui.path=/doc/swagger-ui.html
