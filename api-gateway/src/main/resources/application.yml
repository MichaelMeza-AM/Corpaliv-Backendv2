server:
  port: 9090
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: productos
              uri: http://producto-service:8081
              predicates:
                - Path=/api/productos,/api/productos/**
            - id: colaboraciones
              uri: http://colaboracion-service:8082
              predicates:
                - Path=/api/solicitudes,/api/solicitudes/**
            - id: pedidos
              uri: http://pedido-service:8084
              predicates:
                - Path=/api/pedidos,/api/pedidos/**
            - id: autenticacion
              uri: http://auth-service:8083
              predicates:
                - Path=/api/auth/**,/api/usuarios,/api/usuarios/**
corpaliv:
  jwt-secret: ${CORPALIV_JWT_SECRET}
  jwt-issuer: corpaliv-local
