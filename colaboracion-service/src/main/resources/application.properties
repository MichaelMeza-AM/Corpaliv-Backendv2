server.port=8082
spring.application.name=colaboracion-service
spring.datasource.url=${CORPALIV_DB_URL:jdbc:mysql://localhost:3306/corpaliv_colaboraciones?createDatabaseIfNotExist=true}
spring.datasource.username=${CORPALIV_DB_USER:root}
spring.datasource.password=${CORPALIV_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql
corpaliv.jwt-secret=${CORPALIV_JWT_SECRET}
corpaliv.jwt-issuer=corpaliv-local
springdoc.swagger-ui.path=/doc/swagger-ui.html
