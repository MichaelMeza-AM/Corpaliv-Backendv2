server.port=8083
spring.application.name=auth-service
spring.datasource.url=${CORPALIV_DB_URL:jdbc:mysql://localhost:3306/corpaliv_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${CORPALIV_DB_USER:root}
spring.datasource.password=${CORPALIV_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql
corpaliv.jwt-secret=${CORPALIV_JWT_SECRET}
corpaliv.jwt-issuer=corpaliv-local
corpaliv.admin-email=${CORPALIV_ADMIN_EMAIL}
corpaliv.admin-password=${CORPALIV_ADMIN_PASSWORD}
springdoc.swagger-ui.path=/doc/swagger-ui.html
